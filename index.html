<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fake or Fakt - ChallengeChamp</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-image: url('index1.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      overflow-x: hidden;
      color: #fff;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
      background: rgba(0, 0, 0, 0.75);
      border-radius: 20px;
      margin-top: 40px;
      animation: fadeIn 0.6s ease;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h1, h2, h3 {
      text-align: center;
      text-shadow: 2px 2px 6px #000;
    }

    select, button, input, textarea {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 10px;
      border: none;
      font-size: 1rem;
      box-sizing: border-box;
    }

    button {
      background-color: #ff4081;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.2s;
    }

    button:hover {
      background-color: #e91e63;
      transform: translateY(-2px);
    }

    .card {
      background: #fff;
      color: #000;
      border-radius: 20px;
      padding: 20px;
      margin: 20px 0;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      animation: slideUp 0.6s ease;
      text-align: center;
    }

    .secret-card-box {
      background: linear-gradient(135deg, #2f3542, #57606f);
      border: 2px dashed #00eaff;
      border-radius: 16px;
      padding: 25px 15px;
      margin: 20px 0;
      cursor: pointer;
      font-size: 1.1rem;
      font-weight: bold;
      user-select: none;
      transition: transform 0.2s;
      color: #fff;
    }

    .option-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      text-align: left;
      padding: 12px;
      margin: 8px 0;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .option-btn:hover, .option-btn.selected {
      background: #00eaff;
      color: #000;
      font-weight: bold;
    }

    .player-pill-list {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      list-style: none;
      padding: 0;
      margin: 15px 0;
    }

    .player-pill-list li {
      background: rgba(255,255,255,0.15);
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .hidden {
      display: none !important;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes slideUp {
      from { transform: translateY(50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .menu-button {
      background-color: #4CAF50;
      color: white;
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
    }

    .menu-button:hover {
      background-color: #45a049;
    }

    footer {
      text-align: center;
      margin: 30px 0 15px 0;
    }

    footer a {
      color: #aaa;
      text-decoration: none;
      margin: 0 5px;
    }
  </style>
</head>
<body>

  <!-- ONLINE MULTIPLAYER CONTAINER -->
  <div class="container hidden" id="online-game-container"></div>

  <!-- OFFLINE SETUP (Klassisch auf einem Handy) -->
  <div class="container" id="setup">
    <h1>🎭 Fake or Fakt</h1>
    <h2>Spiel-Einstellungen (Offline)</h2>

    <select id="playerCount">
      <option value="">Spieleranzahl wählen</option>
      <option value="3">3 Spieler</option>
      <option value="4">4 Spieler</option>
      <option value="5">5 Spieler</option>
      <option value="6">6 Spieler</option>
      <option value="7">7 Spieler</option>
      <option value="8">8 Spieler</option>
    </select>

    <select id="liarCount">
      <option value="">Lügneranzahl wählen</option>
      <option value="1">1 Lügner</option>
      <option value="2">2 Lügner</option>
    </select>

    <button onclick="startGame()">Spiel starten</button>
    <button onclick="window.location.href='startseite.html'" class="menu-button">Zurück zum Hauptmenü</button>
  </div>

  <!-- OFFLINE SPIEL-BILDSCHIRME -->
  <div class="container hidden" id="game">
    <div id="playerCard">
      <div class="card">
        <h2>Spieler <span id="playerNumber"></span></h2>
        <button onclick="revealCard()" id="revealBtn">Karte aufdecken</button>
        <div id="cardContent" class="hidden" style="margin-top: 15px;"></div>
      </div>
    </div>
    <button onclick="nextPlayer()" id="nextBtn" class="hidden">Nächster Spieler 👍</button>
  </div>

  <div class="container hidden" id="reveal">
    <h2>Alle Karten wurden gezeigt!</h2>
    <p id="starterInfo"></p>
    <button onclick="showLiars()">Lügner auflösen</button>
  </div>

  <div class="container hidden" id="result">
    <h2>🕵️‍♂️ Die Lügner waren:</h2>
    <ul id="liarList" style="text-align: left; max-width: 250px; margin: auto;"></ul>
    <button onclick="location.reload()">🔄 Neues Spiel</button>
  </div>

  <!-- FIREBASE & SKRIPTE -->
  <script type="module" src="firebase-config.js"></script>
  <script src="party-config.js"></script>

  <!-- SKRIPT-LOGIK -->
  <script>
    // Großer Pool an echten Fakten aus ganz unterschiedlichen Kategorien
    const realFactsPool = [
      { category: "Botanik 🍌", fact: "Bananen sind botanisch gesehen Beeren, während Erdbeeren wissenschaftlich nicht dazu zählen." },
      { category: "Meeresbiologie 🐧", fact: "Kaiserpinguine können über 500 Meter tief tauchen und dabei mehr als 20 Minuten unter Wasser bleiben." },
      { category: "Architektur 🗼", fact: "Der Eiffelturm ist im Sommer durch die Wärmeausdehnung des Eisens bis zu 15 cm höher als im Winter." },
      { category: "Ernährung 🍯", fact: "Honig wird niemals schlecht – in ägyptischen Pharaonengräbern wurde essbarer Honig gefunden, der über 3.000 Jahre alt ist." },
      { category: "Astronomie 🪐", fact: "Ein einziger Tag auf dem Planeten Venus dauert länger als ein ganzes Jahr auf der Venus." },
      { category: "Biologie 🦈", fact: "Haie existierten schon auf der Erde, bevor es die ersten Bäume gab." },
      { category: "Geografie 🌋", fact: "Der höchste Berg der Erde (vom Meeresgrund aus gemessen) ist nicht der Mount Everest, sondern der Mauna Kea auf Hawaii." },
      { category: "Anatomie 🐙", fact: "Kraken haben drei Herzen und blaues Blut." },
      { category: "Geschichte 🍫", fact: "Schokolade wurde von den Maya und Aztekischen Herrschern früher als Zahlungsmittel verwendet." },
      { category: "Physik ⚡", fact: "Ein einziger Blitzschlag enthält genug Energie, um etwa 100.000 Scheiben Brot zu toasten." }
    ];

    // Pool an vorbereiteten Fakes für Lügner (aus völlig anderen Kategorien)
    const fakeOptionsPool = [
      {
        category: "Tierwelt 🐘",
        fake1: "Elefanten sind die einzigen Säugetiere, die nicht springen können.",
        fake2: "Zebras nutzen ihre Streifen, um mit Infrarotstrahlen andere Zebras zu orten."
      },
      {
        category: "Alltag & Technik 📱",
        fake1: "Das erste Mobiltelefon wog fast 5 Kilogramm und hatte einen Akku für nur 3 Minuten Gesprächszeit.",
        fake2: "Kugelschreiber wurden ursprünglich entwickelt, um unter Wasser schreiben zu können."
      },
      {
        category: "Kultur & Geschichte 🏛️",
        fake1: "In der Renaissance trugen Könige Schuhe aus getrocknetem Brot als Modetrend.",
        fake2: "Die Chinesische Mauer wurde früher mit einer Mischung aus Reismehl gekittet."
      }
    ];

    // =========================================================================
    // ONLINE MULTIPLAYER ENGINE FOR FAKE OR FAKT
    // =========================================================================
    class OnlineFakeOrFaktManager {
      constructor(partyCode, playerId) {
        this.partyCode = partyCode;
        this.playerId = playerId;
        this.isHost = false;
        this.partyData = null;
        this.selectedFakeText = "";
        this.init();
      }

      init() {
        document.getElementById('setup').classList.add('hidden');
        document.getElementById('online-game-container').classList.remove('hidden');

        const checkFB = setInterval(() => {
          if (window.firebaseDB) {
            clearInterval(checkFB);
            this.listenToParty();
          }
        }, 100);
      }

      listenToParty() {
        const partyRef = window.fbRef(window.firebaseDB, 'parties/' + this.partyCode);
        const playerRef = window.fbRef(window.firebaseDB, `parties/${this.partyCode}/players/${this.playerId}`);

        window.fbOnDisconnect(playerRef).remove();

        window.fbOnValue(partyRef, (snapshot) => {
          if (!snapshot.exists()) {
            alert("Die Party wurde aufgelöst.");
            window.location.href = "startseite.html";
            return;
          }

          this.partyData = snapshot.val();
          this.isHost = (this.partyData.hostId === this.playerId);

          if (this.partyData.players && !this.partyData.players[this.playerId]) {
            const storedName = sessionStorage.getItem("cc_player_name") || "Spieler";
            window.fbSet(playerRef, {
              name: storedName,
              isHost: this.isHost,
              joinedAt: Date.now()
            });
            return;
          }

          this.renderState();
        });
      }

      renderState() {
        const state = this.partyData.gameState || { status: 'setup' };
        const players = Object.values(this.partyData.players || {});
        const container = document.getElementById('online-game-container');

        // 1. ZUSTAND: SETUP
        if (state.status === 'setup') {
          if (this.isHost) {
            const maxLiars = Math.max(1, players.length - 2);
            let options = '';
            for (let i = 1; i <= maxLiars; i++) {
              options += `<option value="${i}">${i} Lügner</option>`;
            }

            container.innerHTML = `
              <h1>👑 Fake or Fakt (Host)</h1>
              <p>Mitspieler in dieser Party (${players.length}):</p>
              <ul class="player-pill-list">
                ${players.map(p => `<li>${p.name}${p.isHost ? ' 👑' : ''}</li>`).join('')}
              </ul>

              <div style="margin: 20px 0;">
                <label><b>Anzahl der Lügner wählen:</b></label>
                <select id="onlineLiarSelect">${options}</select>
              </div>

              <button onclick="onlineManager.startRound()">🎲 Rollen verteilen & Starten</button>
            `;
          } else {
            container.innerHTML = `
              <h1>⏳ Wartefenster</h1>
              <p>Der Host wählt gerade die Lügner-Anzahl aus...</p>
              <p style="opacity:0.8;">Beigetretene Spieler (${players.length}):</p>
              <ul class="player-pill-list">
                ${players.map(p => `<li>${p.name}${p.isHost ? ' 👑' : ''}</li>`).join('')}
              </ul>
            `;
          }
        }
        // 2. ZUSTAND: KARTE AUFDECKEN / LÜGE EINGEBEN
        else if (state.status === 'reveal_cards') {
          const myRole = state.roles ? state.roles[this.playerId] : 'fact';

          if (myRole === 'liar') {
            const fakeData = state.fakeData || fakeOptionsPool[0];

            container.innerHTML = `
              <h1>🤫 DU BIST DER LÜGNER!</h1>
              <p>Erfinde einen Fake-Fakt oder wähle eine Option:</p>

              <button class="option-btn" id="opt1" onclick="onlineManager.selectOption(1, '${fakeData.fake1}')">
                1️⃣ ${fakeData.fake1}
              </button>
              <button class="option-btn" id="opt2" onclick="onlineManager.selectOption(2, '${fakeData.fake2}')">
                2️⃣ ${fakeData.fake2}
              </button>

              <p style="margin-top:15px; font-weight:bold;">ODER völlig eigene Lüge eingeben:</p>
              <input type="text" id="customFakeInput" placeholder="Deine erfundene Behauptung..." oninput="onlineManager.selectCustomOption(this.value)">

              <button id="btn-submit-fake" style="margin-top:20px;" onclick="onlineManager.submitFakeChoice()">
                Lüge bestätigen & Weiter 👍
              </button>
            `;
          } else {
            const myFactItem = state.assignedFacts ? state.assignedFacts[this.playerId] : { category: "Fakt", fact: "Wahrheit" };

            container.innerHTML = `
              <h1>📜 DEIN FAKT (Wahrheit)</h1>
              <p>Kategorie: <b>${myFactItem.category}</b></p>
              
              <div class="secret-card-box" style="border-color:#2ed573;">
                ${myFactItem.fact}
              </div>

              <p style="font-size:0.9rem; opacity:0.8;">Trage diesen Fakt gleich in der Runde überzeugend vor!</p>

              <button onclick="onlineManager.confirmFactReady()">
                Gelesen & Bereit 👍
              </button>
            `;
          }
        }
        // 3. ZUSTAND: DISKUSSION & VORTRAG
        else if (state.status === 'playing') {
          container.innerHTML = `
            <h1>🗣️ Tragt eure Fakten vor!</h1>
            <p>Jeder Spieler liest seine Aussage laut vor. Welcher Fakt ist erstunken und erlogen?</p>

            ${this.isHost ? `
              <div style="margin-top: 30px;">
                <button style="background: #ff4757; font-size: 1.2rem;" onclick="onlineManager.revealLiars()">
                  🚨 Lügner auflösen
                </button>
              </div>
            ` : `
              <p style="margin-top: 25px; opacity: 0.8;">⏳ Der Host löst das Spiel auf, sobald ihr abgestimmt habt.</p>
            `}
          `;
        }
        // 4. ZUSTAND: AUFLÖSUNG
        else if (state.status === 'revealed') {
          const liarNames = state.liarIds.map(id => this.partyData.players[id]?.name || "Unbekannt");

          container.innerHTML = `
            <h1>🎉 Auflösung!</h1>
            
            <div style="margin: 20px 0; padding: 15px; background: rgba(255,71,87,0.25); border-radius: 12px; border: 1px solid #ff4757;">
              <h3>🕵️‍♂️ Der Lügner war / Die Lügner waren:</h3>
              <h2 style="color: #ff4757; margin: 5px 0;">${liarNames.join(", ")}</h2>
            </div>

            ${this.isHost ? `
              <button onclick="onlineManager.resetToSetup()">🔄 Nächste Runde starten</button>
            ` : `
              <p style="opacity: 0.8;">Warte darauf, dass der Host die nächste Runde startet...</p>
            `}
          `;
        }
      }

      async startRound() {
        const liarCount = parseInt(document.getElementById("onlineLiarSelect").value, 10);
        const playerIds = Object.keys(this.partyData.players);

        const shuffledPlayers = [...playerIds].sort(() => 0.5 - Math.random());
        const liars = shuffledPlayers.slice(0, liarCount);

        const shuffledFacts = [...realFactsPool].sort(() => 0.5 - Math.random());
        const assignedFacts = {};
        
        let factIndex = 0;
        playerIds.forEach(id => {
          if (!liars.includes(id)) {
            assignedFacts[id] = shuffledFacts[factIndex % shuffledFacts.length];
            factIndex++;
          }
        });

        const randomFakeSet = fakeOptionsPool[Math.floor(Math.random() * fakeOptionsPool.length)];

        const roles = {};
        playerIds.forEach(id => {
          roles[id] = liars.includes(id) ? 'liar' : 'fact';
        });

        const partyRef = window.fbRef(window.firebaseDB, 'parties/' + this.partyCode + '/gameState');
        await window.fbSet(partyRef, {
          status: 'reveal_cards',
          assignedFacts: assignedFacts,
          fakeData: randomFakeSet,
          roles: roles,
          liarIds: liars
        });
      }

      selectOption(num, text) {
        this.selectedFakeText = text;
        document.getElementById("customFakeInput").value = "";
        document.querySelectorAll(".option-btn").forEach(btn => btn.classList.remove("selected"));
        document.getElementById("opt" + num).classList.add("selected");
      }

      selectCustomOption(val) {
        this.selectedFakeText = val;
        document.querySelectorAll(".option-btn").forEach(btn => btn.classList.remove("selected"));
      }

      async submitFakeChoice() {
        if (!this.selectedFakeText.trim()) {
          alert("Bitte wähle eine Lüge aus oder gib eine eigene ein!");
          return;
        }

        const choiceRef = window.fbRef(window.firebaseDB, `parties/${this.partyCode}/gameState/fakeChoices/${this.playerId}`);
        await window.fbSet(choiceRef, this.selectedFakeText);

        if (this.isHost) {
          const statusRef = window.fbRef(window.firebaseDB, `parties/${this.partyCode}/gameState/status`);
          window.fbSet(statusRef, 'playing');
        } else {
          document.getElementById('online-game-container').innerHTML = `
            <h1>⏳ Bitte warten...</h1>
            <p>Deine Lüge wurde gespeichert. Warte darauf, dass der Host die Diskussion freigibt.</p>
          `;
        }
      }

      async confirmFactReady() {
        if (this.isHost) {
          const statusRef = window.fbRef(window.firebaseDB, `parties/${this.partyCode}/gameState/status`);
          window.fbSet(statusRef, 'playing');
        } else {
          document.getElementById('online-game-container').innerHTML = `
            <h1>⏳ Bitte warten...</h1>
            <p>Warte darauf, dass der Host die Diskussion freigibt.</p>
          `;
        }
      }

      async revealLiars() {
        const partyRef = window.fbRef(window.firebaseDB, 'parties/' + this.partyCode + '/gameState/status');
        await window.fbSet(partyRef, 'revealed');
      }

      async resetToSetup() {
        const partyRef = window.fbRef(window.firebaseDB, 'parties/' + this.partyCode + '/gameState');
        await window.fbSet(partyRef, { status: 'setup' });
      }
    }

    // MULTIPLAYER CHECK BEIM LADEN
    let onlineManager = null;
    const urlParams = new URLSearchParams(window.location.search);
    const partyCode = urlParams.get('party');
    const playerId = urlParams.get('player');

    if (partyCode && playerId) {
      onlineManager = new OnlineFakeOrFaktManager(partyCode, playerId);
    }

    // =========================================================================
    // OFFLINE SPIEL-LOGIK (PASS & PLAY) - VOLLSTÄNDIG ERHALTEN & OPTIMIERT
    // =========================================================================
    let playerRoles = [];
    let currentPlayer = 0;
    let offlineLiars = [];
    let offlineSelectedFakeText = "";

    function startGame() {
      const playerCount = parseInt(document.getElementById('playerCount').value);
      const liarCount = parseInt(document.getElementById('liarCount').value);

      if (!playerCount || !liarCount) {
        alert("Bitte Spieleranzahl und Lügneranzahl wählen.");
        return;
      }

      const shuffledFacts = [...realFactsPool].sort(() => 0.5 - Math.random());
      const randomFakeSet = fakeOptionsPool[Math.floor(Math.random() * fakeOptionsPool.length)];

      playerRoles = [];
      offlineLiars = [];

      while (offlineLiars.length < liarCount) {
        const index = Math.floor(Math.random() * playerCount);
        if (!offlineLiars.includes(index)) {
          offlineLiars.push(index);
        }
      }

      let factIndex = 0;
      for (let i = 0; i < playerCount; i++) {
        if (offlineLiars.includes(i)) {
          playerRoles.push({ role: 'liar', fakeData: randomFakeSet });
        } else {
          playerRoles.push({ role: 'fact', item: shuffledFacts[factIndex % shuffledFacts.length] });
          factIndex++;
        }
      }

      currentPlayer = 0;
      document.getElementById('setup').classList.add('hidden');
      document.getElementById('game').classList.remove('hidden');
      showPlayer();
    }

    function showPlayer() {
      document.getElementById('playerNumber').innerText = currentPlayer + 1;
      document.getElementById('cardContent').classList.add('hidden');
      document.getElementById('cardContent').innerHTML = '';
      document.getElementById('nextBtn').classList.add('hidden');
      document.getElementById('revealBtn').disabled = false;
      document.getElementById('revealBtn').style.opacity = 1;
      offlineSelectedFakeText = "";
    }

    function revealCard() {
      const cardContent = document.getElementById('cardContent');
      const data = playerRoles[currentPlayer];

      if (data.role === 'liar') {
        cardContent.innerHTML = `
          <h3 style="color: #ff4757; margin-top: 0;">🤫 DU BIST DER LÜGNER!</h3>
          <p style="color: #000;">Wähle eine Option ODER tippe deine eigene Lüge ein:</p>
          
          <button class="option-btn" id="offOpt1" style="background:#2f3542; color:#fff;" onclick="selectOfflineOption(1, '${data.fakeData.fake1}')">
            1️⃣ ${data.fakeData.fake1}
          </button>
          <button class="option-btn" id="offOpt2" style="background:#2f3542; color:#fff;" onclick="selectOfflineOption(2, '${data.fakeData.fake2}')">
            2️⃣ ${data.fakeData.fake2}
          </button>

          <input type="text" id="offCustomFake" placeholder="Eigene Lüge eingeben..." style="margin-top:10px; border:1px solid #ccc; background:#f9f9f9; color:#000;" oninput="selectOfflineCustomOption(this.value)">
        `;
      } else {
        cardContent.innerHTML = `
          <h3 style="color: #2ed573; margin-top: 0;">📜 DEIN FAKT (Wahrheit)</h3>
          <p style="color: #000; font-size: 1.1rem; font-weight: bold;">Kategorie: ${data.item.category}</p>
          <p style="color: #000; font-size: 1.1rem; background: #f1f2f6; padding: 12px; border-radius: 10px;">
            ${data.item.fact}
          </p>
        `;
      }

      cardContent.classList.remove('hidden');
      document.getElementById('revealBtn').disabled = true;
      document.getElementById('revealBtn').style.opacity = 0.6;
      document.getElementById('nextBtn').classList.remove('hidden');
    }

    function selectOfflineOption(num, text) {
      offlineSelectedFakeText = text;
      const customInp = document.getElementById("offCustomFake");
      if (customInp) customInp.value = "";
      document.querySelectorAll("#cardContent .option-btn").forEach(btn => btn.style.background = "#2f3542");
      const btn = document.getElementById("offOpt" + num);
      if (btn) btn.style.background = "#ff4081";
    }

    function selectOfflineCustomOption(val) {
      offlineSelectedFakeText = val;
      document.querySelectorAll("#cardContent .option-btn").forEach(btn => btn.style.background = "#2f3542");
    }

    function nextPlayer() {
      const data = playerRoles[currentPlayer];
      if (data.role === 'liar' && !offlineSelectedFakeText.trim()) {
        alert("Bitte wähle eine Lüge aus oder gib eine eigene ein!");
        return;
      }

      currentPlayer++;
      if (currentPlayer < playerRoles.length) {
        showPlayer();
      } else {
        document.getElementById('game').classList.add('hidden');
        document.getElementById('reveal').classList.remove('hidden');
        const starter = Math.floor(Math.random() * playerRoles.length) + 1;
        document.getElementById('starterInfo').innerText = `Spieler ${starter} beginnt mit der ersten Aussage.`;
      }
    }

    function showLiars() {
      document.getElementById('reveal').classList.add('hidden');
      document.getElementById('result').classList.remove('hidden');
      const list = document.getElementById('liarList');
      list.innerHTML = '';
      offlineLiars.forEach(i => {
        const li = document.createElement('li');
        li.textContent = `Spieler ${i + 1}`;
        list.appendChild(li);
      });
    }
  </script>
</body>
