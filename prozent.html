<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prozent-Rätzer 🎯 - ChallengeChamp</title>

<style>
/* -------------------- GLOBAL & DESIGNS -------------------- */
body {
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #0f172a;
  color: #fff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
}

h1 {
  text-align: center;
  color: #fff;
  margin-top: 25px;
  font-size: 2.2rem;
  text-shadow: 0 4px 12px rgba(0,0,0,0.6);
}

.card-box {
  background: rgba(30, 41, 59, 0.9);
  backdrop-filter: blur(12px);
  border-radius: 22px;
  padding: 25px;
  width: 90%;
  max-width: 450px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  margin: 20px auto;
  border: 1px solid rgba(255,255,255,0.1);
  box-sizing: border-box;
  text-align: center;
}

.btn {
  background: linear-gradient(135deg, #00eaff, #00c4d4);
  color: #000;
  border: none;
  padding: 14px 20px;
  border-radius: 16px;
  font-size: 1.1rem;
  font-weight: 900;
  cursor: pointer;
  width: 100%;
  margin-top: 12px;
  box-shadow: 0 4px 15px rgba(0,234,255,0.3);
  transition: all 0.2s ease;
  box-sizing: border-box;
}

.btn:hover {
  transform: scale(1.03);
}

.btn-secondary {
  background: #334155;
  color: #fff;
}

input, select {
  width: 100%;
  padding: 12px 16px;
  border-radius: 12px;
  border: 1px solid #475569;
  background: #0f172a;
  color: #fff;
  font-size: 1rem;
  margin-top: 8px;
  box-sizing: border-box;
  text-align: center;
}

.slider-container { margin: 25px 0; }

.slider-val {
  font-size: 2.8rem;
  font-weight: 900;
  color: #00eaff;
  text-shadow: 0 0 15px rgba(0,234,255,0.6);
  margin: 10px 0;
}

input[type=range] {
  -webkit-appearance: none;
  width: 100%;
  background: #334155;
  height: 12px;
  border-radius: 6px;
}

input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: #00eaff;
  cursor: pointer;
}

.anim-fade-in { animation: fadeIn 0.4s ease forwards; }
.anim-pop { animation: popUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes popUp {
  0% { opacity: 0; transform: scale(0.7); }
  100% { opacity: 1; transform: scale(1); }
}

.result-item {
  background: #334155;
  padding: 12px 16px;
  border-radius: 12px;
  margin: 10px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: bold;
}

.rank-badge {
  background: #00eaff;
  color: #000;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  margin-right: 10px;
}

.diff-tag { color: #ff4757; font-size: 0.95rem; margin-left: 8px; }

.kahoot-row {
  background: #1e293b;
  border-radius: 14px;
  padding: 12px 18px;
  margin: 8px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-left: 6px solid #3b82f6;
}

.kahoot-row:nth-child(1) { border-left-color: #ffd700; background: rgba(255,215,0,0.1); }
.kahoot-row:nth-child(2) { border-left-color: #c0c0c0; background: rgba(192,192,192,0.1); }
.kahoot-row:nth-child(3) { border-left-color: #cd7f32; background: rgba(205,127,50,0.1); }

.podium-container {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 10px;
  margin: 30px 0 20px 0;
  height: 180px;
}

.podium-step {
  width: 30%;
  background: linear-gradient(180deg, #334155, #1e293b);
  border-radius: 12px 12px 0 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  padding-bottom: 10px;
  font-weight: bold;
  position: relative;
}

.podium-1 { height: 160px; background: linear-gradient(180deg, #ffd700, #b39700); color: #000; }
.podium-2 { height: 120px; background: linear-gradient(180deg, #c0c0c0, #7f7f7f); color: #000; }
.podium-3 { height: 90px; background: linear-gradient(180deg, #cd7f32, #8c5622); color: #fff; }

.podium-crown { position: absolute; top: -28px; font-size: 1.5rem; }
</style>
</head>
<body>

<h1>Prozent-Rätzer 🎯</h1>

<!-- SCREEN 1: EINSTELLUNGEN -->
<div id="screenSetup" class="card-box anim-fade-in">
  <h2>Spiel-Einstellungen (Offline)</h2>
  
  <label>Anzahl der Spieler:</label>
  <select id="playerCountSelect" onchange="generateNameInputs()">
    <option value="2">2 Spieler</option>
    <option value="3" selected>3 Spieler</option>
    <option value="4">4 Spieler</option>
    <option value="5">5 Spieler</option>
    <option value="6">6 Spieler</option>
  </select>

  <div id="nameInputsContainer" style="margin-top: 15px;"></div>

  <div style="margin-top: 15px;">
    <label>Runden-Anzahl (Fragen):</label>
    <select id="roundCountSelect">
      <option value="3">3 Runden</option>
      <option value="5" selected>5 Runden</option>
      <option value="7">7 Runden</option>
      <option value="10">10 Runden</option>
    </select>
  </div>

  <button class="btn" onclick="startOfflineGame()">Spiel Starten 🚀</button>
  <button class="btn btn-secondary" onclick="window.location.href='startseite.html'">Zurück zur Startseite</button>
</div>

<!-- SCREEN 2: SCHÄTZEN / HANDY WEITERGEBEN -->
<div id="screenGuess" class="card-box anim-fade-in" style="display: none;">
  <div style="display:flex; justify-content:space-between; color:#94a3b8; font-size:0.9rem;">
    <span id="roundIndicator">Frage 1/5</span>
    <span id="turnIndicator" style="color:#00eaff; font-weight:bold;">Spieler 1 ist dran</span>
  </div>

  <h3 id="questionText" style="margin: 20px 0; font-size:1.25rem;">Frage wird geladen...</h3>

  <div class="slider-container">
    <div id="sliderValue" class="slider-val">50%</div>
    <input type="range" id="guessSlider" min="0" max="100" value="50" oninput="document.getElementById('sliderValue').innerText = this.value + '%'">
  </div>

  <button class="btn" id="btnSubmitGuess" onclick="submitOfflineGuess()">Antwort einloggen 🔒</button>
</div>

<!-- SCREEN 3: RUNDEN-AUSWERTUNG -->
<div id="screenRoundResult" class="card-box anim-fade-in" style="display: none;">
  <h2>Runden-Ergebnis</h2>
  <h4 id="resultQuestionTitle" style="color:#94a3b8; font-weight:normal;"></h4>

  <div id="answersList" style="margin: 20px 0;"></div>

  <div id="correctAnswerBox" class="anim-pop" style="display:none; background:rgba(0,234,255,0.15); border:2px solid #00eaff; padding:15px; border-radius:16px; margin-top:15px;">
    Tatsächliche Lösung: <b id="correctPercentText" style="font-size:1.8rem; color:#00eaff;">0%</b>
  </div>

  <button id="btnNextToTable" class="btn" style="display:none;" onclick="showLeaderboard()">Zur Tabelle 📊</button>
</div>

<!-- SCREEN 4: TABELLE -->
<div id="screenLeaderboard" class="card-box anim-fade-in" style="display: none;">
  <h2>Gesamtwertung 📊</h2>
  <p style="font-size:0.85rem; color:#94a3b8;">Weniger Punkte (Differenz) ist besser!</p>

  <div id="kahootTable" style="margin: 20px 0;"></div>

  <button id="btnNextQuestion" class="btn" onclick="nextOfflineRound()">Nächste Frage ⏩</button>
</div>

<!-- SCREEN 5: ENDE & PODEST -->
<div id="screenGameOver" class="card-box anim-fade-in" style="display: none;">
  <h2>🏆 Endplatzierung 🏆</h2>

  <div class="podium-container" id="podiumBox"></div>

  <div id="remainingLeaderboard"></div>

  <div style="background:rgba(255,215,0,0.15); border:1px solid #ffd700; padding:12px; border-radius:14px; margin: 15px 0; color:#ffd700; font-weight:bold;">
    🪙 Belohnung: <span id="coinsEarnedText">+0</span> Coins erhalten!
  </div>

  <button class="btn" onclick="restartOfflineGame()">Erneut Spielen 🔄</button>
  <button class="btn btn-secondary" onclick="window.location.href='startseite.html'">Startseite</button>
</div>

<script>
const questionBank = [
  { q: "Wie viel Prozent der Weltbevölkerung sind Linkshänder?", a: 10 },
  { q: "Wie viel Prozent der Erdoberfläche sind mit Wasser bedeckt?", a: 71 },
  { q: "Wie viel Prozent der Menschen weltweit haben braune Augen?", a: 79 },
  { q: "Wie viel Prozent der Erde ist von Wüsten bedeckt?", a: 33 },
  { q: "Wie viel Prozent des menschlichen Körpers bestehen aus Wasser?", a: 60 },
  { q: "Wie viel Prozent der Menschen können ihre Ohren wackeln lassen?", a: 10 },
  { q: "Wie viel Prozent aller Katzen sind weiß?", a: 5 },
  { q: "Wie viel Prozent des geernteten Kaffees weltweit ist Arabica-Kaffee?", a: 60 },
  { q: "Wie viel Prozent der Bevölkerung hat die Blutgruppe 0 Positiv?", a: 38 },
  { q: "Wie viel Prozent des Sauerstoffs auf der Erde erzeugen die Ozeane?", a: 50 },
  { q: "Wie viel Prozent der Bevölkerung träumt manchmal in Schwarz-Weiß?", a: 12 },
  { q: "Wie viel Prozent der Eisberge befinden sich unter der Wasseroberfläche?", a: 90 }
];

let offlinePlayers = [];
let currentQuestionIndex = 0;
let selectedQuestions = [];
let maxRounds = 5;
let currentTurnPlayerIdx = 0;

document.addEventListener("DOMContentLoaded", () => {
  generateNameInputs();
});

function generateNameInputs() {
  const count = parseInt(document.getElementById("playerCountSelect").value);
  const container = document.getElementById("nameInputsContainer");
  container.innerHTML = "";
  for (let i = 1; i <= count; i++) {
    const input = document.createElement("input");
    input.type = "text";
    input.placeholder = `Name Spieler ${i}`;
    input.value = `Spieler ${i}`;
    input.id = `playerName_${i}`;
    container.appendChild(input);
  }
}

function startOfflineGame() {
  const count = parseInt(document.getElementById("playerCountSelect").value);
  maxRounds = parseInt(document.getElementById("roundCountSelect").value);

  offlinePlayers = [];
  for (let i = 1; i <= count; i++) {
    const pName = document.getElementById(`playerName_${i}`).value.trim() || `Spieler ${i}`;
    offlinePlayers.push({ id: "p_" + i, name: pName, score: 0, currentGuess: 50, currentDiff: 0 });
  }

  selectedQuestions = [...questionBank].sort(() => 0.5 - Math.random()).slice(0, maxRounds);
  currentQuestionIndex = 0;

  startOfflineTurn();
}

function startOfflineTurn() {
  currentTurnPlayerIdx = 0;
  showOfflineGuessScreen();
}

function showOfflineGuessScreen() {
  hideAllScreens();
  document.getElementById("screenGuess").style.display = "block";

  const q = selectedQuestions[currentQuestionIndex];
  const p = offlinePlayers[currentTurnPlayerIdx];

  document.getElementById("roundIndicator").innerText = `Frage ${currentQuestionIndex + 1}/${maxRounds}`;
  document.getElementById("turnIndicator").innerText = `${p.name} ist dran 📱`;
  document.getElementById("questionText").innerText = q.q;

  document.getElementById("guessSlider").value = 50;
  document.getElementById("sliderValue").innerText = "50%";
  document.getElementById("btnSubmitGuess").innerText = `${p.name}: Antwort einloggen 🔒`;
}

function submitOfflineGuess() {
  const val = parseInt(document.getElementById("guessSlider").value);
  offlinePlayers[currentTurnPlayerIdx].currentGuess = val;
  currentTurnPlayerIdx++;

  if (currentTurnPlayerIdx < offlinePlayers.length) {
    showOfflineGuessScreen();
  } else {
    processOfflineRoundResults();
  }
}

function processOfflineRoundResults() {
  const q = selectedQuestions[currentQuestionIndex];

  offlinePlayers.forEach(p => {
    p.currentDiff = Math.abs(p.currentGuess - q.a);
    p.score += p.currentDiff;
  });

  showRoundResultAnimation([...offlinePlayers], q.a, q.q);
}

function showRoundResultAnimation(playersArray, correctAnswer, questionText) {
  hideAllScreens();
  document.getElementById("screenRoundResult").style.display = "block";
  document.getElementById("resultQuestionTitle").innerText = questionText;

  const answersList = document.getElementById("answersList");
  answersList.innerHTML = "";
  document.getElementById("correctAnswerBox").style.display = "none";
  document.getElementById("btnNextToTable").style.display = "none";

  const roundRanked = [...playersArray].sort((a, b) => a.currentDiff - b.currentDiff);

  roundRanked.forEach((p, idx) => {
    setTimeout(() => {
      const item = document.createElement("div");
      item.className = "result-item anim-pop";

      item.innerHTML = `
        <div>
          <span class="rank-badge">${idx + 1}</span>
          <span>${p.name}</span>
        </div>
        <div>
          <b>${p.currentGuess}%</b>
          <span class="diff-tag">(-${p.currentDiff})</span>
        </div>
      `;
      answersList.appendChild(item);
    }, (idx + 1) * 800);
  });

  const totalDelay = (roundRanked.length + 1) * 800;
  setTimeout(() => {
    document.getElementById("correctPercentText").innerText = correctAnswer + "%";
    document.getElementById("correctAnswerBox").style.display = "block";
    document.getElementById("btnNextToTable").style.display = "block";
  }, totalDelay);
}

function showLeaderboard() {
  hideAllScreens();
  document.getElementById("screenLeaderboard").style.display = "block";

  const table = document.getElementById("kahootTable");
  table.innerHTML = "";

  const sorted = [...offlinePlayers].sort((a, b) => a.score - b.score);

  sorted.forEach((p, idx) => {
    const row = document.createElement("div");
    row.className = "kahoot-row anim-pop";
    row.style.animationDelay = (idx * 0.15) + "s";
    row.innerHTML = `
      <div>
        <b style="font-size:1.1rem; margin-right:10px;">#${idx + 1}</b>
        <span>${p.name}</span>
      </div>
      <b>${p.score} Pkt. (Diff)</b>
    `;
    table.appendChild(row);
  });

  const isLastRound = (currentQuestionIndex + 1) >= maxRounds;
  const btn = document.getElementById("btnNextQuestion");

  if (isLastRound) {
    btn.innerText = "Zur Siegerehrung 🏆";
    btn.onclick = finishOfflineGame;
  } else {
    btn.innerText = "Nächste Frage ⏩";
    btn.onclick = nextOfflineRound;
  }
}

function nextOfflineRound() {
  currentQuestionIndex++;
  startOfflineTurn();
}

function finishOfflineGame() {
  hideAllScreens();
  document.getElementById("screenGameOver").style.display = "block";

  const sorted = [...offlinePlayers].sort((a, b) => a.score - b.score);

  const podiumBox = document.getElementById("podiumBox");
  podiumBox.innerHTML = "";

  const podiumOrder = [sorted[1], sorted[0], sorted[2]];
  const classes = ["podium-2", "podium-1", "podium-3"];
  const crowns = ["🥈", "👑", "🥉"];

  podiumOrder.forEach((p, idx) => {
    if (p) {
      const step = document.createElement("div");
      step.className = `podium-step ${classes[idx]}`;
      step.innerHTML = `
        <div class="podium-crown">${crowns[idx]}</div>
        <div>${p.name}</div>
        <small>${p.score} Pkt.</small>
      `;
      podiumBox.appendChild(step);
    }
  });

  const remainingBox = document.getElementById("remainingLeaderboard");
  remainingBox.innerHTML = "";
  if (sorted.length > 3) {
    sorted.slice(3).forEach((p, idx) => {
      const row = document.createElement("div");
      row.className = "kahoot-row";
      row.innerHTML = `<span>#${idx + 4} ${p.name}</span><b>${p.score} Pkt.</b>`;
      remainingBox.appendChild(row);
    });
  }

  const coinsEarned = maxRounds * 15;
  let currentCoins = parseInt(localStorage.getItem("teamMasterCoins") || "0", 10);
  currentCoins += coinsEarned;
  localStorage.setItem("teamMasterCoins", currentCoins);

  document.getElementById("coinsEarnedText").innerText = "+" + coinsEarned;
}

function restartOfflineGame() {
  hideAllScreens();
  document.getElementById("screenSetup").style.display = "block";
}

function hideAllScreens() {
  document.getElementById("screenSetup").style.display = "none";
  document.getElementById("screenGuess").style.display = "none";
  document.getElementById("screenRoundResult").style.display = "none";
  document.getElementById("screenLeaderboard").style.display = "none";
  document.getElementById("screenGameOver").style.display = "none";
}
</script>

</body>
</html>
